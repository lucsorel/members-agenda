networks:
    adminer-network:
        name: adminer-network
        # use the bridge driver
        driver: bridge

volumes:
    dbdata:
        driver: local
        driver_opts:
            type: 'none'
            o: 'bind'
            device: '${MEMBERS_AGENDA_DB_VOLUME:?error}'

services:
  postgres_server:
    image: postgres:16.4
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${MEMBERS_AGENDA_DATABASE:?error}
      POSTGRES_USER: ${MEMBERS_AGENDA_USER:?error}
      POSTGRES_PASSWORD: ${MEMBERS_AGENDA_PASSWORD:?error}
    ports:
      - 5432:5432
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - adminer-network

  adminer:
    image: adminer
    ports:
      - 8888:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres_server
    depends_on:
      - postgres_server
    networks:
      - adminer-network
